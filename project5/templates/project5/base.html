{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 5: RL with Human Feedback</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'project5/css/style.css' %}" />
    <link
      rel="stylesheet"
      href="{% static 'project5/css/enhanced-style.css' %}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="{% url 'project5:index' %}">
          <i class="fas fa-brain me-2"></i>RL with Human Feedback
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 me-3">
            <li class="nav-item">
              <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}" href="{% url 'project5:index' %}">
                <i class="fas fa-home me-1"></i>Home
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.resolver_match.url_name == 'start_training' %}active{% endif %}" href="{% url 'project5:start_training' %}">
                <i class="fas fa-play me-1"></i>Start Training
              </a>
            </li>
          </ul>
          <!-- Right-aligned buttons -->
          <div class="d-flex">
            <a href="{% url 'home:index' %}#projects" class="btn btn-outline-light">
              <i class="fas fa-arrow-left me-2"></i>Back to Projects
            </a>
          </div>
        </div>
      </div>
    </nav>

    <div class="container-fluid px-4 mt-4">{% block content %} {% endblock %}</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'project5/js/script.js' %}"></script>
    
    <!-- Additional styling for better UI -->
    <style>
      body {
        background-color: #f8f9fa;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      
      .navbar-brand {
        font-size: 1.25rem;
        font-weight: 600;
      }
      
      .nav-link {
        font-weight: 500;
        transition: color 0.2s ease;
      }
      
      .nav-link:hover {
        color: #fff !important;
      }
      
      .btn {
        font-weight: 500;
        transition: all 0.2s ease;
      }
      
      .btn:hover {
        transform: translateY(-1px);
      }
      
      .card {
        border: none;
        border-radius: 12px;
      }
      
      .shadow-sm {
        box-shadow: 0 .125rem .25rem rgba(0,0,0,.075) !important;
      }
    </style>
  </body>
</html>
