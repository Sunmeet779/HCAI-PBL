{% extends "project3/base.html" %}

{% block content %}
<div class="text-center mb-12">
  <h1 class="text-4xl font-bold text-gray-800 mb-3">Penguin Species Classifier</h1>
  <p class="text-xl text-gray-600">Explore model explainability techniques</p>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl mx-auto">
  {% for task in tasks %}
  <a href="{% url task.url %}" 
     class="card bg-white group relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-blue-500 to-purple-600 opacity-0 group-hover:opacity-10 transition-opacity"></div>
    <div class="p-6">
      <div class="flex justify-between items-start mb-4">
        <h2 class="text-xl font-semibold text-gray-800">{{ task.title }}</h2>
        <span class="badge {{ task.color }} text-white">
          {{ task.label }}
        </span>
      </div>
      <p class="text-gray-600 mb-4">{{ task.description }}</p>
      <div class="flex items-center text-blue-600 group-hover:text-blue-800 transition-colors">
        <span class="mr-2">Explore</span>
        <i class="fas fa-arrow-right"></i>
      </div>
    </div>
  </a>
  {% endfor %}
</div>
{% endblock %}
