runtime: python311  # or python310
entrypoint: gunicorn pbl.wsgi:application

instance_class: F2

beta_settings:
  cloud_sql_instances: hcaiproject:europe-west1:sqlcloud

handlers:
  - url: /static
    static_dir: static/

  - url: /.*
    script: auto

env_variables:
  DJANGO_SETTINGS_MODULE: pbl.settings
  DEBUG: 'False'
